name: Build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build desktop app
        run: cargo build --release --features desktop --locked
      - name: Report executable size
        shell: pwsh
        run: |
          $exe = Get-Item target/release/cmf-eq.exe
          $size = [math]::Round($exe.Length / 1MB, 2)
          "Windows executable: $size MiB" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: cmf-eq-windows-x64
          path: target/release/cmf-eq.exe
          if-no-files-found: error
          retention-days: 7
